<!--
  =====================================================
  AllerSearch フィード埋め込みスニペット
  index.html の好きな場所にそのまま貼り付けて使う
  サーバーは同じ localhost:3000 で動いている前提
  =====================================================
-->

<style>
  .as-feed-section {
    padding: 60px 24px;
    background: #FAF7F2;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .as-feed-eyebrow {
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #C9A84C;
    margin-bottom: 10px;
    text-align: center;
  }
  .as-feed-title {
    font-size: 22px;
    font-weight: 300;
    text-align: center;
    color: #1A1814;
    margin-bottom: 8px;
  }
  .as-feed-title em { font-style: italic; color: #C9A84C; }
  .as-feed-sub {
    text-align: center;
    font-size: 12px;
    color: #6B6560;
    margin-bottom: 36px;
    font-weight: 300;
  }

  /* スクロールトラック */
  .as-feed-track-wrap {
    overflow: hidden;
    position: relative;
  }
  .as-feed-track {
    display: flex;
    gap: 16px;
    animation: as-scroll 40s linear infinite;
    width: max-content;
  }
  .as-feed-track:hover { animation-play-state: paused; }
  @keyframes as-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* カード */
  .as-card {
    width: 240px;
    flex-shrink: 0;
    background: white;
    border: 1px solid #E2DDD6;
    border-radius: 4px;
    padding: 18px 16px;
    cursor: default;
    transition: box-shadow .2s, border-color .2s;
  }
  .as-card:hover {
    box-shadow: 0 6px 24px rgba(26,24,20,.08);
    border-color: #C9A84C;
  }
  .as-card-badge {
    display: inline-block;
    font-size: 9px;
    letter-spacing: .15em;
    text-transform: uppercase;
    background: #1A6EF5;
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .as-card-name {
    font-size: 14px;
    font-weight: 500;
    color: #1A1814;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .as-card-allergens {
    font-size: 10px;
    color: #C9A84C;
    margin-bottom: 8px;
    font-weight: 400;
  }
  .as-card-comment {
    font-size: 11px;
    color: #6B6560;
    line-height: 1.7;
    font-weight: 300;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .as-card-review {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #E2DDD6;
    font-size: 11px;
    color: #1A1814;
    font-weight: 300;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .as-card-reviewer {
    font-size: 10px;
    color: #C9A84C;
    margin-top: 4px;
  }
  .as-feed-empty {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    padding: 40px;
  }

  /* フェードエッジ */
  .as-feed-track-wrap::before,
  .as-feed-track-wrap::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 60px;
    z-index: 1;
    pointer-events: none;
  }
  .as-feed-track-wrap::before { left: 0;  background: linear-gradient(to right, #FAF7F2, transparent); }
  .as-feed-track-wrap::after  { right: 0; background: linear-gradient(to left,  #FAF7F2, transparent); }
</style>

<section class="as-feed-section">
  <div class="as-feed-eyebrow">Community · Allergy Info</div>
  <h2 class="as-feed-title">みんなの<em>アレルギー対応</em>レポート</h2>
  <p class="as-feed-sub">AllerSearchユーザーが調べたアレルギー対応店舗情報をリアルタイムでお届け</p>

  <div class="as-feed-track-wrap">
    <div class="as-feed-track" id="as-feed-track">
      <div class="as-feed-empty">読み込み中...</div>
    </div>
  </div>
</section>

<script>
(async () => {
  try {
    const res  = await fetch('/api/feed');
    const data = await res.json();

    if (!data.length) {
      document.getElementById('as-feed-track').innerHTML =
        '<div class="as-feed-empty">まだデータがありません。AllerSearchで調査してみよう！</div>';
      return;
    }

    const makeCard = d => {
      const reviewHtml = d.review
        ? `<div class="as-card-review">「${d.review}」</div>
           <div class="as-card-reviewer">— ${d.reviewer}</div>`
        : '';
      return `
        <div class="as-card">
          <div class="as-card-badge">✓ 対応確認済</div>
          <div class="as-card-name">${d.name}</div>
          <div class="as-card-allergens">${d.allergens || ''}</div>
          <div class="as-card-comment">${d.comment || ''}</div>
          ${reviewHtml}
        </div>`;
    };

    // カードを2セット並べて無限ループ
    const cards = data.map(makeCard).join('');
    document.getElementById('as-feed-track').innerHTML = cards + cards;

  } catch(e) {
    document.getElementById('as-feed-track').innerHTML =
      '<div class="as-feed-empty">データを取得できませんでした</div>';
  }
})();
</script>
